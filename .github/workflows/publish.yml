name: Publish to npm

# Publishes packages/mantine-react-table as mantine-react-table-ng.
#
# Setup, once: add an npm automation token with publish rights as the
# repository secret NPM_TOKEN.
#
# To release: set "version" in packages/mantine-react-table/package.json, merge
# to v4, then publish a GitHub release whose tag is "v" plus that version
# (for example v4.0.0-beta.0). A version with a prerelease part is published
# under that part as its dist-tag ("beta"); any other version becomes "latest".
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build, test and pack, but do not publish
        type: boolean
        default: true

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read
  # Lets npm attach a provenance statement that links the package to this run.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/mantine-react-table
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Read version and dist-tag
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ -n "$RELEASE_TAG" ] && [ "$RELEASE_TAG" != "v$version" ]; then
            echo "::error::Release tag $RELEASE_TAG does not match package.json version $version (expected v$version)"
            exit 1
          fi
          case "$version" in
            *-*) tag=$(echo "$version" | cut -d- -f2 | cut -d. -f1) ;;
            *) tag=latest ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Publishing mantine-react-table-ng@$version with dist-tag $tag" >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if this version is already on npm
        run: |
          if npm view "mantine-react-table-ng@${{ steps.version.outputs.version }}" version 2>/dev/null | grep -q .; then
            echo "::error::mantine-react-table-ng@${{ steps.version.outputs.version }} is already published"
            exit 1
          fi

      - name: Copy the root README into the package
        run: cp ../../README.md README.md

      # prepublishOnly runs lint, typecheck, the library build and the unit
      # tests in all four React Compiler modes before anything is uploaded.
      - name: Publish (dry run)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
        run: pnpm publish --dry-run --no-git-checks --access public --tag ${{ steps.version.outputs.tag }}

      - name: Publish
        if: ${{ github.event_name == 'release' || !inputs.dry-run }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
        run: pnpm publish --no-git-checks --access public --tag ${{ steps.version.outputs.tag }}
